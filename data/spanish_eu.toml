[[goods.entries]]
id = 4600100
name = "Grasa Regresiva"
info = "Restaura completamente al personaje"
description = """\
Objeto para duelos en multijugador en línea.
Hechizado con encantaciones de Fundamentalistas del Orden Dorado.

Se usa para restaurar a un duelista a su estado normal antes de la batalla.

Cura los PV, PC, el equilibrio, elimina toda aflicción y efecto especial.\
"""

[[goods.entries]]
id = 4600300
name = "Campana llamadora de fantasmas"
info = "Llama a los fantasmas que dejaron su señal roja"
description = """\
Objeto para duelos en multijugador en línea.
Hechizado con encantaciones de Fundamentalistas del Orden Dorado.

Una poderosa campana que se usa para invocar a quienes buscan batalla. Invoca todas las señales rojas disponibles.\
"""

[[goods.entries]]
id = 4602001
name = "Dedo cercenado de Sinluz"
info = "Se intercambia con Varré, el Rostro Alabastrado, por objetos útiles para las invasiones en multijugador."
description = """\
El dedo doblado de un Sinluz, mutilado y reconocible solo por su tenue resonancia con otros mundos.
Sirve como prueba de la contribución propia a la inminente dinastía Mohgwyn: el derramamiento de sangre noble.

Los caballeros de sangre pura, o quienes aspiran a ser ungidos como tales, los intercambian por equipo que podría resultar eficaz en futuros derramamientos de sangre.\
"""

[[goods.entries]]
id = 4602002
name = "Moneda de tinaja"
info = "Se intercambia en la tienda de la tinaja de la Mesa Redonda por objetos útiles en multijugador cooperativo."
description = """\
Siguiendo la cultura de las tinajas, los Sinluz regalan estas monedas a sus compañeros para mostrar su gratitud por la cooperación en combate.
En la Mesa Redonda, una tinaja acepta estas monedas a cambio de objetos que los cooperadores podrían encontrar útiles, sobre todo para repeler a los invasores.\
"""


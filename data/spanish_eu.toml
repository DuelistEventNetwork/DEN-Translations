[[goods.entries]]
id = 4600000
name = "Trenza de Marika"
info = "Revive al morir, restaura al personaje"
description = """\
Objeto para duelos en multijugador en línea.
Hechizado con encantaciones de Fundamentalistas del Orden Dorado.

Se usa para rescatar a un duelista de las puertas de la muerte al ser derrotado, y restaurarles a su estado normal.

Al morir, cura los PV, PC, el equilibrio, elimina toda aflicción y efecto especial.\
"""

[[goods.entries]]
id = 4600100
name = "Grasa Regresiva"
info = "Restaura completamente al personaje"
description = """\
Objeto para duelos en multijugador en línea.
Hechizado con encantaciones de Fundamentalistas del Orden Dorado.

Se usa para restaurar a un duelista a su estado normal antes de la batalla.

Cura los PV, PC, el equilibrio, elimina toda aflicción y efecto especial.\
"""

[[goods.entries]]
id = 4600200
name = "Tarro de la Abundancia"
info = "Otorga un suministro ilimitado de cualquier bien actualmente sujetado"
description = """\
Objeto para duelos en multijugador en línea.
Hechizado con encantaciones de Fundamentalistas del Orden Dorado.

Se usa para almacenar y retener un suministro infinito de bienes.
Cualquier objeto usado mantendrá su cantidad actual.

Un peculiar tarro sin fondo. Sus orígenes son desconocidos. Algunos lo ridiculizan como un símbolo de avaricia sin límites.\
"""

[[goods.entries]]
id = 4600300
name = "Phantom Calling Bell"
info = "Calls phantoms who left their red sign"
description = """\
Item for online duelist play.
Enchanted by incantations of the Golden Order Fundamentalists.

A powerful bell used to summon those who seek a battle. Summons all available red signs.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


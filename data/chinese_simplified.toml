[[goods.entries]]
id = 4600100
name = "逆溯油脂"
info = "使角色完好如初"
description = """\
联机决斗的道具。
被赋予黄金律法基本主义的祷告，使斗士于作战前瞬间恢复至原来状态。

完全恢复HP、FP及强韧度，彻底治愈后遗症，并解除所有特殊状态。\
"""

[[goods.entries]]
id = 4600300
name = "召战魂铃"
info = "召唤留下血色记号的战魂，展开联机决斗"
description = """\
联机决斗的道具。
被赋予黄金律法基本主义的祷告。

能唤来嗜战之士的强大召魂铃。可召集留下血色记号的待战者。\
"""

[[goods.entries]]
id = 4602001
name = "褪色者的断指"
info = "可通过“白面具”梵雷兑换适用于入侵联机的道具。"
description = """\
褪色者的勾指，已遭残损，只能凭借与其他世界残存的共鸣辨认出来。
被用作为即将到来的蒙格温王朝作出贡献——即流淌高贵之血——的证明。

纯血骑士，或渴望受膏成为其中一员的人，会用它交换或许能在日后的流血中派上用场的装备。\
"""

[[goods.entries]]
id = 4602002
name = "壶币"
info = "可在圆桌厅堂的壶商店兑换适用于合作联机的道具。"
description = """\
效仿壶的文化，褪色者会将这些硬币赠予同伴，以感谢他们在战斗中的协助。
在圆桌厅堂，有一只壶会收下这些硬币，交换协助者可能用得上的道具，尤其是用于击退入侵者的道具。\
"""


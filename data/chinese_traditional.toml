[[goods.entries]]
id = 4600100
name = "逆溯油脂"
info = "使角色完好如初"
description = """\
聯機決鬥的道具。
被賦予黃金律法基本主義的禱告，使鬥士於作戰前瞬間恢復至原來狀態。

完全恢復HP、FP及強韌度，徹底治癒後遺症，並解除所有特殊狀態。\
"""

[[goods.entries]]
id = 4600300
name = "召戰魂鈴"
info = "召喚留下血色記號的戰魂，展開聯機決鬥"
description = """\
聯機決鬥的道具。
被賦予黃金律法基本主義的禱告。

能喚來嗜戰之士的強大召魂鈴。可召集留下血色記號的待戰者。\
"""

[[goods.entries]]
id = 4602001
name = "褪色者的斷指"
info = "可透過「白面具」梵雷兌換適用於入侵聯機的道具。"
description = """\
褪色者的勾指，已遭殘損，只能憑藉與其他世界殘存的共鳴辨認出來。
被用作為即將到來的蒙格溫王朝作出貢獻——即流淌高貴之血——的證明。

純血騎士，或渴望受膏成為其中一員的人，會用它交換或許能在日後的流血中派上用場的裝備。\
"""

[[goods.entries]]
id = 4602002
name = "壺幣"
info = "可在圓桌廳堂的壺商店兌換適用於合作聯機的道具。"
description = """\
效仿壺的文化，褪色者會將這些硬幣贈予同伴，以感謝他們在戰鬥中的協助。
在圓桌廳堂，有一只壺會收下這些硬幣，交換協助者可能用得上的道具，尤其是用於擊退入侵者的道具。\
"""


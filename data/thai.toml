[[goods.entries]]
id = 4600100
name = "ไขมันแห่งการย้อนกลับ"
info = "ฟื้นฟูตัวละครอย่างเต็มตัว"
description = """\
ไอเทมสำหรับนักดวลออนไลน์.
ร่ายมนตร์ด้วยคาถาของผู้เคร่งครัดแห่งบัญญัติทอง.

ใช้เพื่อฟื้นฟูนักดวลให้กลับสู่สภาพปกติก่อนการต่อสู้อย่างรวดเร็ว.

ฟื้นฟู HP, FP คืนความมั่นคง ขจัดสภาวะผิดปกติทั้งหมดและลบล้างเอฟเฟกต์พิเศษทั้งหมด.\
"""

[[goods.entries]]
id = 4600300
name = "ระฆังเรียกแฟนทอม"
info = "เรียกแฟนทอมที่ทิ้งสัญลักษณ์สีแดงไว้"
description = """\
ไอเทมสำหรับนักดวลออนไลน์.
ร่ายมนตร์ด้วยคาถาของผู้เคร่งครัดแห่งบัญญัติทอง.

ระฆังทรงพลังที่ใช้อัญเชิญผู้ที่แสวงหาการต่อสู้ อัญเชิญสัญลักษณ์สีแดงทั้งหมดที่มีอยู่.\
"""

[[goods.entries]]
id = 4602001
name = "นิ้วที่ถูกตัดของผู้มัวหมอง"
info = "นำไปแลกกับวาเล่ หน้ากากขาวเพื่อรับไอเทมที่มีประโยชน์ในการบุกรุกแบบผู้เล่นหลายคน"
description = """\
นิ้วงอของผู้มัวหมองที่ถูกทำลายจนจำแทบไม่ได้ เหลือเพียงร่องรอยการสั่นพ้องกับโลกอื่น.
ใช้เป็นหลักฐานแสดงการมีส่วนร่วมต่อราชวงศ์ม็อควินที่กำลังจะมาถึง นั่นคือการหลั่งโลหิตอันสูงศักดิ์.

อัศวินเลือดบริสุทธิ์ หรือผู้ที่ปรารถนาจะได้รับการเจิมเป็นหนึ่งในนั้น จะนำสิ่งนี้ไปแลกกับอุปกรณ์ที่อาจมีประสิทธิภาพในการหลั่งเลือดครั้งต่อไป.\
"""

[[goods.entries]]
id = 4602002
name = "เหรียญโถ"
info = "นำไปแลกที่ร้านโถแห่งโต๊ะกลมเพื่อรับไอเทมที่มีประโยชน์ในการเล่นแบบร่วมมือ"
description = """\
ผู้มัวหมองสืบทอดวัฒนธรรมของโถ จึงมอบเหรียญเหล่านี้ให้แก่สหายเพื่อแสดงความขอบคุณที่ร่วมมือกันในการต่อสู้.
ที่โต๊ะกลม มีโถใบหนึ่งรับเหรียญเหล่านี้เพื่อแลกกับไอเทมที่ผู้ร่วมมืออาจเห็นว่ามีประโยชน์ โดยเฉพาะสำหรับขับไล่ผู้บุกรุก.\
"""


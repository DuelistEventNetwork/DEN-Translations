[[goods.entries]]
id = 4600100
name = "회귀성 기름"
info = "사용 시, HP, FP, 강인도를 회복한다."
description = """\
온라인 결투용 아이템. 황금률 원리주의의 기도가 깃들어있다.

투사라 불린 빛바랜 자들은 이를 결투 전에 사용하여 회복하였다고 한다.

사용 시, HP, FP, 강인도를 모두 회복하고, 모든 이로운 효과와 상태이상을 해제한다.\
"""

[[goods.entries]]
id = 4600300
name = "팬텀 호출 방울"
info = "붉은 사인을 남긴 팬텀을 불러낸다."
description = """\
온라인 결투용 아이템. 황금률 원리주의의 기도가 깃들어있다.

싸움을 원하는 자들을 소환하는 강력한 방울. 사용 가능한 모든 붉은 사인을 소환한다.\
"""

[[goods.entries]]
id = 4602001
name = "빛바랜 자의 잘린 손가락"
info = "백면 바레를 통해 침입 멀티플레이에 유용한 아이템과 교환할 수 있다."
description = """\
빛바랜 자의 갈고리 손가락. 훼손되어 다른 세계와의 희미한 공명으로만 알아볼 수 있다.
다가올 모그윈 왕조에 대한 공헌, 즉 고귀한 피를 흘린 증거로 쓰인다.

순혈 기사, 혹은 그리 성별받기를 원하는 자들은 이것을 앞으로의 유혈에 유용할 장비와 교환한다.\
"""

[[goods.entries]]
id = 4602002
name = "항아리 코인"
info = "원탁의 항아리 상점에서 협력 멀티플레이에 유용한 아이템과 교환할 수 있다."
description = """\
항아리의 문화를 본받아, 빛바랜 자들은 전투에서의 협력에 감사를 표하고자 동료에게 이 코인을 건넨다.
원탁에서는 한 항아리가 이 코인을 받고, 협력자에게 유용할 만한 아이템, 특히 침입자를 물리치는 데 쓰일 아이템과 교환해 준다.\
"""


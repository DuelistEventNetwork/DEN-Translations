[[goods.entries]]
id = 4600000
name = "Trança de Marika"
info = "Revive na morte, restaurando completamente o personagem."
description = """\
Item para duelos online.
Encantado por encantamentos dos Fundamentalistas da Ordem Áurea.

Usado para trazer de volta um duelista à beira da morte após sua derrota e restaurá-lo ao seu estado natural.

Na morte, cura totalmente PV, PF, equilíbrio, remove todas as doenças e dissipa todos os efeitos especiais.\
"""

[[goods.entries]]
id = 4600100
name = "Sebo Regressivo"
info = "Restaura o personagem completamente"
description = """\
Item para duelos online.
Encantado por encantamentos dos Fundamentalistas da Ordem Áurea.

Usado para restaurar rapidamente um duelista ao seu estado natural antes de uma batalha.

Cura completamente PV, PF, equilíbrio, remove todas as doenças e dissipa todos os efeitos especiais.\
"""

[[goods.entries]]
id = 4600200
name = "Ó Jarro Abundante"
info = "Concede um suprimento infinito de quaisquer itens equipados."
description = """\
Item para duelos online.
Encantado por encantamentos dos Fundamentalistas da Ordem Áurea.

Usado para manter um suprimento infinito de itens.
Quaisquer itens usados manterão sua quantidade atual.

Um peculiar jarro sem-fundo. Suas origens são desconhecidas. Alguns ridicularizam-no como símbolo de avareza sem medida.\
"""

[[goods.entries]]
id = 4600300
name = "Phantom Calling Bell"
info = "Calls phantoms who left their red sign"
description = """\
Item for online duelist play.
Enchanted by incantations of the Golden Order Fundamentalists.

A powerful bell used to summon those who seek a battle. Summons all available red signs.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


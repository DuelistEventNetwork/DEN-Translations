[[goods.entries]]
id = 4600100
name = "Sebo Regressivo"
info = "Restaura o personagem completamente"
description = """\
Item para duelos online.
Encantado por encantamentos dos Fundamentalistas da Ordem Áurea.

Usado para restaurar rapidamente um duelista ao seu estado natural antes de uma batalha.

Cura completamente PV, PF, equilíbrio, remove todas as doenças e dissipa todos os efeitos especiais.\
"""

[[goods.entries]]
id = 4600300
name = "Sino de Chamado de Fantasmas"
info = "Chama os fantasmas que deixaram seu sinal vermelho"
description = """\
Item para duelos online.
Encantado por encantamentos dos Fundamentalistas da Ordem Áurea.

Um sino poderoso usado para invocar aqueles que buscam uma batalha. Invoca todos os sinais vermelhos disponíveis.\
"""

[[goods.entries]]
id = 4602001
name = "Dedo Decepado de Maculado"
info = "Troque com Varré da Máscara Branca por itens úteis para invasões no multijogador."
description = """\
O dedo enrolado de um Maculado, mutilado e reconhecível apenas por sua tênue ressonância com outros mundos.
Usado como prova da contribuição para a vindoura dinastia Mohgwyn: o derramamento de sangue nobre.

Cavaleiros Sangue-Puro, ou aqueles que almejam ser ungidos como um, trocam-nos por equipamentos que podem ser eficazes em futuros derramamentos de sangue.\
"""

[[goods.entries]]
id = 4602002
name = "Moeda de Jarro"
info = "Troque na loja do jarro da Mesa-Redonda por itens úteis no multijogador cooperativo."
description = """\
Seguindo a cultura dos jarros, os Maculados presenteiam seus companheiros com estas moedas para demonstrar gratidão pela cooperação em batalha.
Na Mesa-Redonda, um jarro aceita estas moedas em troca de itens que cooperadores podem achar úteis, especialmente para repelir invasores.\
"""


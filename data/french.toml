[[goods.entries]]
id = 4600000
name = "Tresse de Marika"
info = "Ressuscite après la mort, rétablis entièrement le personnage "
description = """\
Un objet destiné pour les duellistes.
Enchanté par les incantations des Fondamentalistes de l'Ordre d'Or.

Utilisé dans le but de ramener à la vie un duelliste déchu, en le rétablissant entièrement.

Vous ramène à la vie après votre mort, soigne complètement les PV, les PC, rétablis l'équilibre, puis retire tous les effets positifs et négatifs du duelliste.\
"""

[[goods.entries]]
id = 4600100
name = "Graisse Régressive"
info = "Rétablis entièrement le personnage"
description = """\
Un objet destiné pour les duellistes.
Enchanté par les incantations des Fondamentalistes de l'Ordre d'Or.

Utilisé dans le but de rétablir entièrement le duelliste avant la bataille.

Soigne complètement les PV, les PC, rétablis l'équilibre, puis retire tous les effets positifs et négatifs du duelliste.\
"""

[[goods.entries]]
id = 4600200
name = "Pot d'Abondance"
info = "Confère un stock illimité de tous les objets possédés"
description = """\
Un objet destiné pour les duellistes.
Enchanté par les incantations des Fondamentalistes de l'Ordre d'Or.

Utilisé pour stocker et maintenir une quantité d'objets illimitée.
Tous les objets utilisés conserveront leur quantité actuelle.

Un pot sans fond peu ordinaire. Ses origines demeurent inconnues. Certains s'amusent à en faire le symbole d'une avarice éffrénée.\
"""

[[goods.entries]]
id = 4600300
name = "Cloche d'appel des esprits"
info = "Appelle les esprits ayant laissé leurs marques rouges"
description = """\
Un objet destiné pour les duellistes.
Enchanté par les incantations des Fondamentalistes de l'Ordre d'Or.

Une puissante cloche utilisée pour invoquer ceux en recherche d'un combat, invoque toutes les marques rouges disponibles.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


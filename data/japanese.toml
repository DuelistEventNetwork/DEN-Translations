[[goods.entries]]
id = 4600100
name = "回帰脂"
info = "キャラクターを完全に回復させる"
description = """\
オンライン決闘者専用アイテム。
黄金律原理主義の祈祷を付与する。

決闘前に決闘者を素早く自然な状態に戻すために使用する。

HPとFPを全回復し、強靭を回復し、あらゆる状態異常と、特殊な効果を消し去る。\
"""

[[goods.entries]]
id = 4600300
name = "霊呼びの鈴"
info = "赤いサインを書いたファントムを呼ぶ"
description = """\
オンライン決闘者専用アイテム。
黄金律原理主義の祈祷を付与する。

強力な鈴は戦いを求める者達の召喚に使用される。全ての赤いサインを召喚する。\
"""

[[goods.entries]]
id = 4602001
name = "褪せ人の切り落とされた指"
info = "白面のヴァレーを通じて、侵入マルチプレイに役立つアイテムと交換できる"
description = """\
切り落とされた褪せ人の鉤指。無惨に損なわれ、他世界とのかすかな共鳴によってのみ、それと判別できる。
来たるモーグウィン王朝への貢献、すなわち高貴なる血を流したことの証とされる。

純血騎士、あるいはそう聖別されることを望む者たちは、これを来たる流血で役立つであろう装備と交換する。\
"""

[[goods.entries]]
id = 4602002
name = "壺コイン"
info = "円卓の壺の店で、協力マルチプレイに役立つアイテムと交換できる"
description = """\
壺の文化に倣い、褪せ人たちは戦いでの協力への感謝を示すため、仲間にこの硬貨を贈る。
円卓では、ある壺がこの硬貨を受け取り、協力者に役立つであろうアイテム、とりわけ侵入者を退けるためのものと交換してくれる。\
"""


[[goods.entries]]
id = 4600100
name = "شحوم الاسترجاع"
info = "يعيد حالة الشخصية بالكامل"
description = """\
غرض للعب المبارزين عبر الإنترنت.
مُسحور بتعويذات أتباع النظام الذهبي الأصولي.

يُستخدم لاستعادة حالة المبارزين بسرعة إلى وضعهم الطبيعي قبل القتال.

يعيد نقاط الحياة والقدرة السحرية بالكامل، ويستعيد التوازن، ويزيل جميع العلل ويفسخ كل التأثيرات الخاصة.\
"""

[[goods.entries]]
id = 4600300
name = "جرس استدعاء الأطياف"
info = "يستدعي الأطياف الذين تركوا علاماتهم الحمراء"
description = """\
غرض للعب المبارزين عبر الإنترنت.
مُسحور بتعويذات أتباع النظام الذهبي الأساسي.

جرس قوي يُستخدم لاستدعاء من يسعون للقتال. يستدعي جميع العلامات الحمراء المتاحة.\
"""

[[goods.entries]]
id = 4602001
name = "إصبع المشوه المقطوعة"
info = "يُقايَض لدى فاري ذي القناع الأبيض بأغراض مفيدة في الغزو ضمن اللعب الجماعي."
description = """\
إصبع مشوهٍ ملفوفة، مُمثَّلٌ بها لا تُعرف إلا من أثر رنينها الخافت مع العوالم الأخرى.
يُستخدم دليلًا على مساهمة المرء في سلالة موغوين القادمة، أي سفك الدم النبيل.

يقايض فرسان الدم النقي، أو من يسعون إلى أن يُمسَحوا فرسانًا منهم، هذه الأصابع بعتادٍ قد يكون فعّالًا في سفك الدماء مستقبلًا.\
"""

[[goods.entries]]
id = 4602002
name = "عملة الجرّة"
info = "تُقايَض في متجر الجرّة في قلعة الطاولة المستديرة بأغراض مفيدة في اللعب الجماعي التعاوني."
description = """\
اقتداءً بثقافة الجرار، يُهدي المشوهون هذه العملات لرفاقهم تعبيرًا عن تقديرهم لتعاونهم في القتال.
في قلعة الطاولة المستديرة، تقبل جرّةٌ هذه العملات مقابل أغراض قد يجدها المتعاونون مفيدة، لا سيما لصدّ الغزاة.\
"""


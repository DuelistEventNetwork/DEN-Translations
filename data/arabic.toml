[[goods.entries]]
id = 4600000
name = "ضفيرة ماريكا"
info = "يُعيد الإحياء عند الموت ويستعيد حالة الشخصية بالكامل"
description = """\
غرض للعب المبارزين عبر الإنترنت.
مُسحور بتعويذات أتباع النظام الذهبي الأصولي.

يُستخدم لإعادة المبارز من حافة الموت عند هزيمته، وإعادته إلى حالته الطبيعية.

عند الموت، يستعيد نقاط الحياة والقدرة السحرية بالكامل، ويستعيد التوازن، ويزيل جميع العلل ويفسخ كل التأثيرات الخاصة\
"""

[[goods.entries]]
id = 4600100
name = "شحوم الاسترجاع"
info = "يعيد حالة الشخصية بالكامل"
description = """\
غرض للعب المبارزين عبر الإنترنت.
مُسحور بتعويذات أتباع النظام الذهبي الأصولي.

يُستخدم لاستعادة حالة المبارزين بسرعة إلى وضعهم الطبيعي قبل القتال.

يعيد نقاط الحياة والقدرة السحرية بالكامل، ويستعيد التوازن، ويزيل جميع العلل ويفسخ كل التأثيرات الخاصة.\
"""

[[goods.entries]]
id = 4600200
name = "جرّة الوفرة"
info = "تمنح مخزونًا غير محدود من أي غرض بحوزتك"
description = """\
غرض للعب المبارزين عبر الإنترنت.
مُسحور بتعويذات أتباع النظام الذهبي الأصولي.

يُستخدم لتخزين والاحتفاظ بإمدادٍ غير محدود من الأغراض.
أي عنصر يُستخدم سيحتفظ بكمّيته الحالية.

جرّة بلا قاع عجيبة. أصولها مجهولة. ويعدّها البعض رمزًا للجشع غير المقيّد.\
"""

[[goods.entries]]
id = 4600300
name = "جرس استدعاء الأطياف"
info = "يستدعي الأطياف الذين تركوا علاماتهم الحمراء"
description = """\
غرض للعب المبارزين عبر الإنترنت.
مُسحور بتعويذات أتباع النظام الذهبي الأساسي.

جرس قوي يُستخدم لاستدعاء من يسعون للقتال. يستدعي جميع العلامات الحمراء المتاحة.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


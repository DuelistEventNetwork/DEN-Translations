[[goods.entries]]
id = 4600000
name = "Marikas geflochtener Zopf"
info = "Belebt bei Tod wieder, stellt den Charakter vollständig wieder her"
description = """\
Gegenstand für Duellanten.
Verzaubert von den Anrufungen der Fundamentalisten der goldenen Ordnung.

Wird verwendet, um einen Duellanten vom Rande des Todes zurückzubringen und ihn in seinen natürlichen Zustand zu versetzen.

Beim Tod heilt es vollständig HP, FP, stellt das Gleichgewicht wieder her, entfernt alle Leiden und hebt alle Spezialeffekte auf.\
"""

[[goods.entries]]
id = 4600100
name = "Fett der Wiederherstellung"
info = "Stellt den Charakter vollständig wieder her."
description = """\
Gegenstand für Duellanten.
Verzaubert von den Anrufungen der Fundamentalisten der goldenen Ordnung.

Wird verwendet, um Duellanten schnell in ihren natürlichen Zustand vor einem Kampf zu versetzen.

Heilt vollständig HP, FP, stellt das Gleichgewicht wieder her, entfernt alle Leiden und hebt alle Spezialeffekte auf.\
"""

[[goods.entries]]
id = 4600200
name = "O'Gefäß der Fülle"
info = "Bewirkt, dass Verbrauchsgegenstände beim Einsatz nicht mehr verbraucht werden."
description = """\
Gegenstand für Duellanten.
Verzaubert von den Anrufungen der Fundamentalisten der goldenen Ordnung.

Wird verwendet, um einen unendlichen Vorrat an Gegenständen zu speichern und zu erhalten.
Alle verwendeten Gegenstände behalten ihre aktuelle Menge.

Ein merkwürdiges bodenloses Gefäß. Seine Herkunft ist unbekannt. Manche verspotten es als Symbol ungezügelter Gier.\
"""

[[goods.entries]]
id = 4600300
name = "Phantom Calling Bell"
info = "Ruft Phantome, die ihr rotes Zeichen hinterlassen haben"
description = """\
Gegenstand für Duellanten.
Verzaubert von den Anrufungen der Fundamentalisten der goldenen Ordnung.

Eine mächtige Glocke, die verwendet wird, um diejenigen herbeizurufen, die einen Kampf suchen. Ruft alle verfügbaren roten Zeichen.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


[[goods.entries]]
id = 4600100
name = "Fett der Wiederherstellung"
info = "Stellt den Charakter vollständig wieder her."
description = """\
Gegenstand für Duellanten.
Verzaubert von den Anrufungen der Fundamentalisten der goldenen Ordnung.

Wird verwendet, um Duellanten schnell in ihren natürlichen Zustand vor einem Kampf zu versetzen.

Heilt vollständig HP, FP, stellt das Gleichgewicht wieder her, entfernt alle Leiden und hebt alle Spezialeffekte auf.\
"""

[[goods.entries]]
id = 4600300
name = "Phantomrufglocke"
info = "Ruft Phantome, die ihr rotes Zeichen hinterlassen haben"
description = """\
Gegenstand für Duellanten.
Verzaubert von den Anrufungen der Fundamentalisten der goldenen Ordnung.

Eine mächtige Glocke, die verwendet wird, um diejenigen herbeizurufen, die einen Kampf suchen. Ruft alle verfügbaren roten Zeichen.\
"""

[[goods.entries]]
id = 4602001
name = "Abgetrennter Finger eines Befleckten"
info = "Beim Weißgesichtigen Varré gegen Gegenstände eintauschen, die bei Invasionen im Mehrspielermodus nützlich sind."
description = """\
Der Krummfinger eines Befleckten, verstümmelt und nur noch an seiner schwachen Resonanz mit anderen Welten zu erkennen.
Dient als Beweis für den eigenen Beitrag zur kommenden Mohgwyn-Dynastie: das Vergießen edlen Blutes.

Reinblut-Ritter und jene, die danach streben, zu einem solchen gesalbt zu werden, tauschen sie gegen Ausrüstung ein, die beim künftigen Blutvergießen von Nutzen sein könnte.\
"""

[[goods.entries]]
id = 4602002
name = "Krugmünze"
info = "Im Krugladen der Tafelrundfeste gegen Gegenstände eintauschen, die im kooperativen Mehrspielermodus nützlich sind."
description = """\
Der Kultur der Krüge folgend schenken Befleckte diese Münzen ihren Gefährten, um ihre Wertschätzung für die Zusammenarbeit im Kampf zu zeigen.
In der Tafelrundfeste nimmt ein Krug diese Münzen im Tausch gegen Gegenstände an, die Mitstreitern nützlich sein könnten – vor allem, um Eindringlinge abzuwehren.\
"""


[[goods.entries]]
id = 4600100
name = "Grasa Regresiva"
info = "Restaura completamente el personaje"
description = """\
Objeto para juego de duelo en línea.
Encantado por los encantamientos de los fundamentalistas de la Orden Dorada.

Usado para recuperar rápidamente el personaje a su estado natural antes de una batalla.

Restaura completamente el PV, PC, recupera aplomo, cura todos los estados y disipa todos los efectos especiales.\
"""

[[goods.entries]]
id = 4600300
name = "Campana llamadora de fantasmas"
info = "Llama a los fantasmas que dejaron su señal roja"
description = """\
Objeto para juego de duelo en línea.
Encantado por los encantamientos de los fundamentalistas de la Orden Dorada.

Una campana poderosa que se usa para invocar a quienes buscan batalla. Invoca todas las señales rojas disponibles.\
"""

[[goods.entries]]
id = 4602001
name = "Dedo cercenado de Tiznado"
info = "Canjéalo con Varré, la Máscara Blanca, por objetos útiles para invasiones en multijugador."
description = """\
El dedo doblado de un Tiznado, mutilado y reconocible solo por su tenue resonancia con otros mundos.
Se usa como prueba de la contribución propia a la inminente dinastía Mohgwyn: el derramamiento de sangre noble.

Los caballeros de sangre pura, o quienes aspiran a ser ungidos como tales, los canjean por equipo que podría ser efectivo en futuros derramamientos de sangre.\
"""

[[goods.entries]]
id = 4602002
name = "Moneda de tinaja"
info = "Canjéala en la tienda de la tinaja de la Mesa Redonda por objetos útiles en multijugador cooperativo."
description = """\
Siguiendo la cultura de las tinajas, los Tiznados regalan estas monedas a sus compañeros para mostrar su agradecimiento por la cooperación en batalla.
En la Mesa Redonda, una tinaja acepta estas monedas a cambio de objetos que los cooperadores podrían encontrar útiles, especialmente para repeler a los invasores.\
"""


[[goods.entries]]
id = 4600000
name = "Trenza de Marika"
info = "Revive al morir, restaura el personaje completamente"
description = """\
Objeto para juego de duelo en línea.
Encantado por los encantamientos de los fundamentalistas de la Orden Dorada.

Revivirá el personaje al morir, recuperándolo a su estado natural.

Al morir, restaura completamente el PV, PC, recupera aplomo, cura todos los estados y disipa todos los efectos especiales.\
"""

[[goods.entries]]
id = 4600100
name = "Grasa Regresiva"
info = "Restaura completamente el personaje"
description = """\
Objeto para juego de duelo en línea.
Encantado por los encantamientos de los fundamentalistas de la Orden Dorada.

Usado para recuperar rápidamente el personaje a su estado natural antes de una batalla.

Restaura completamente el PV, PC, recupera aplomo, cura todos los estados y disipa todos los efectos especiales.\
"""

[[goods.entries]]
id = 4600200
name = "O'Jarra de Abundancia"
info = "Otorga suministros infinitos de cualquier bien en posesión"
description = """\
Objeto para juego de duelo en línea.
Encantado por los encantamientos de los fundamentalistas de la Orden Dorada.

Usado para guardar y retener un suministro infinito de bienes.
Cualquier objeto usado va a conservar su cantidad actual.

Una jarra sin fondo peculiar. Sus orígenes son desconocidos. Algunos lo caricaturizan como un símbolo de avaricia desenfrenada.\
"""

[[goods.entries]]
id = 4600300
name = "Campana llamadora de fantasmas"
info = "Llama a los fantasmas que dejaron su señal roja"
description = """\
Objeto para juego de duelo en línea.
Encantado por los encantamientos de los fundamentalistas de la Orden Dorada.

Una campana poderosa que se usa para invocar a quienes buscan batalla. Invoca todas las señales rojas disponibles.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


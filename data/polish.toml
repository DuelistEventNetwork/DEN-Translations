[[goods.entries]]
id = 4600000
name = "Warkocz Mariki"
info = "Odradza w momencie śmierci, całkowicie przywraca postać"
description = """\
Przedmiot do gry online.
Zaczarowany przez Fundamentalistów z grupy Złotego Porządku.

Używany przez pojedynkujących się zawodników by tuż przed śmiercią przywrócić pokonanego do stanu pełnego zdrowia.

Po śmierci przywraca HP, FP, poise (równowagę), usuwa wszystkie dolegliwości efekty specjalne.\
"""

[[goods.entries]]
id = 4600100
name = "Smar Regresyjny"
info = "Natychmiastowo uzdrawia postać"
description = """\
Przedmiot do gry online.
Zaczarowany przez Fundamentalistów z grupy Złotego Porządku.

Używany przez pojedynkujących się zawodników by przygotować swoje ciała do walki tuż przed pojedynkiem.

Przywraca HP, FP, poise (równowagę), usuwa wszystkie dolegliwości i efekty specjalne.\
"""

[[goods.entries]]
id = 4600200
name = "Słoik obfitości"
info = "Sprawia, że twoje zapasy nigdy się nie skończą"
description = """\
Przedmiot do gry online.
Używany do przechowywania i utrzymania nieskończonej ilości zasobów.

Specyficzny słój bez dna. Jego pochodzenie jest nieznane.

Niektórzy mawiają, że jest to symbol niepohamowanej chciwości.\
"""

[[goods.entries]]
id = 4600300
name = "Dzwonek przyzywania duchów"
info = "Wzywa duchy które zostawiły ich czerwony znak"
description = """\
Przedmiot do duelowej gry online.
Zaklęte przez inkantacje Fundamentalistów Złotego Porządku.

Potężny dzwonek używany do wzywania tych którzy poszukują walki.

Wzywa wszystkie dostępne czerwone znaki.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


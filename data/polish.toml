[[goods.entries]]
id = 4600100
name = "Smar Regresyjny"
info = "Natychmiastowo uzdrawia postać"
description = """\
Przedmiot do gry online.
Zaczarowany przez Fundamentalistów z grupy Złotego Porządku.

Używany przez pojedynkujących się zawodników by przygotować swoje ciała do walki tuż przed pojedynkiem.

Przywraca HP, FP, poise (równowagę), usuwa wszystkie dolegliwości i efekty specjalne.\
"""

[[goods.entries]]
id = 4600300
name = "Dzwonek przyzywania duchów"
info = "Wzywa duchy które zostawiły ich czerwony znak"
description = """\
Przedmiot do duelowej gry online.
Zaklęte przez inkantacje Fundamentalistów Złotego Porządku.

Potężny dzwonek używany do wzywania tych którzy poszukują walki.

Wzywa wszystkie dostępne czerwone znaki.\
"""

[[goods.entries]]
id = 4602001
name = "Odcięty palec zmatowieńca"
info = "Wymień u Białolicego Varrégo na przedmioty przydatne podczas inwazji w trybie wieloosobowym."
description = """\
Zgięty palec zmatowieńca, okaleczony i rozpoznawalny jedynie po słabym rezonansie z innymi światami.
Służy jako dowód wkładu w nadchodzącą dynastię Mohgwynów – przelewanie szlachetnej krwi.

Rycerze czystej krwi lub ci, którzy pragną zostać na nich namaszczeni, wymieniają je na wyposażenie, które może okazać się skuteczne przy przyszłym przelewaniu krwi.\
"""

[[goods.entries]]
id = 4602002
name = "Dzbanowa moneta"
info = "Wymień w dzbanowym sklepie w Twierdzy Okrągłego Stołu na przedmioty przydatne w kooperacyjnym trybie wieloosobowym."
description = """\
Idąc za kulturą dzbanów, zmatowieńcy ofiarowują te monety swoim towarzyszom, by okazać wdzięczność za współpracę w walce.
W Twierdzy Okrągłego Stołu pewien dzban przyjmuje te monety w zamian za przedmioty, które mogą się przydać współpracownikom, zwłaszcza do odpierania najeźdźców.\
"""


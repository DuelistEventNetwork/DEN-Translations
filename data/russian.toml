[[goods.entries]]
id = 4600000
name = "Коса Марики"
info = "Воскрешает после смерти, полностью восстанавливает персонажа"
description = """\
Предмет для онлайн-дуэлей.
Зачарован заклинаниями фундаменталистов Золотого Порядка.

Помогает вернуть дуэлянта с грани смерти после поражения и восстановить его естественное состояние.

После смерти полностью восстанавливает ОЗ, ОК, баланс, излечивает все недуги и рассеивает особые эффекты.\
"""

[[goods.entries]]
id = 4600100
name = "Регрессивная смазка"
info = "Полностью восстанавливает персонажа"
description = """\
Предмет для онлайн-дуэлей.
Зачарован заклинаниями фундаменталистов Золотого Порядка.

Используется для быстрого восстановления естественного состояния дуэлянтов перед сражением.

Полностью восстанавливает ОЗ, ОК, баланс, излечивает все недуги и рассеивает особые эффекты.\
"""

[[goods.entries]]
id = 4600200
name = "Кувшин изобилия"
info = "Даёт неограниченное количество имеющихся в наличии расходных предметов"
description = """\
Предмет для онлайн-дуэлей.
Зачарован заклинаниями фундаменталистов Золотого Порядка.

Используется для получения неограниченного количества расходных предметов.
Любой используемый предмет будет сохранять своё текущее количество.

Необычный бездонный кувшин, его происхождение неизвестно. Некоторые считают его символом безудержной алчности.\
"""

[[goods.entries]]
id = 4600300
name = "Призывающий колокол"
info = "Призывает фантомов, оставивших свой вражеский знак."
description = """\
Предмет для онлайн-дуэлей.
Зачарован заклинаниями фундаменталистов Золотого Порядка.

Могущественный колокол, используемый для призыва тех, кто ищет сражения. Призывает все имеющиеся вражеские знаки.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""


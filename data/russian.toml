[[goods.entries]]
id = 4600100
name = "Регрессивная смазка"
info = "Полностью восстанавливает персонажа"
description = """\
Предмет для онлайн-дуэлей.
Зачарован заклинаниями фундаменталистов Золотого Порядка.

Используется для быстрого восстановления естественного состояния дуэлянтов перед сражением.

Полностью восстанавливает ОЗ, ОК, баланс, излечивает все недуги и рассеивает особые эффекты.\
"""

[[goods.entries]]
id = 4600300
name = "Призывающий колокол"
info = "Призывает фантомов, оставивших свой вражеский знак."
description = """\
Предмет для онлайн-дуэлей.
Зачарован заклинаниями фундаменталистов Золотого Порядка.

Могущественный колокол, используемый для призыва тех, кто ищет сражения. Призывает все имеющиеся вражеские знаки.\
"""

[[goods.entries]]
id = 4602001
name = "Отрубленный палец Погасшего"
info = "Можно обменять у Белоликого Варрэ на предметы, полезные при вторжениях в мультиплеере."
description = """\
Скрюченный палец Погасшего, изувеченный и узнаваемый лишь по слабому резонансу с другими мирами.
Служит доказательством вклада в становление грядущей династии Могвинов — пролитие благородной крови.

Рыцари чистой крови и те, кто стремится быть помазанным в их число, обменивают эти пальцы на снаряжение, которое может пригодиться в будущих кровопролитиях.\
"""

[[goods.entries]]
id = 4602002
name = "Кувшинная монета"
info = "Можно обменять в кувшинной лавке Крепости Круглого стола на предметы, полезные в совместной игре."
description = """\
Следуя культуре кувшинов, Погасшие дарят эти монеты своим спутникам в знак благодарности за помощь в бою.
В Крепости Круглого стола один кувшин принимает эти монеты в обмен на предметы, которые могут пригодиться союзникам, особенно для отражения захватчиков.\
"""


[[goods.entries]]
id = 4600100
name = "Unguento Regressivo"
info = "Ripristina completamente il personaggio"
description = """\
Oggetto per Duellare Online.
Incantato dalle preghiere dei Fondamentalisti della Legge Dorata.

Usato per ripristinare rapidamente i duellanti al loro stato prima della battaglia.

Cura completamente HP, FP, ripristina la Poise, rimuove tutti gli status alterati ed effetti speciali.\
"""

[[goods.entries]]
id = 4600300
name = "Campana di richiamo dei fantasmi"
info = "Richiama i fantasmi che hanno lasciato il loro segno rosso"
description = """\
Oggetto per Duellare Online.
Incantato dalle preghiere dei Fondamentalisti della Legge Dorata.

Una potente campana usata per evocare coloro che cercano battaglia. Evoca tutti i segni rossi disponibili.\
"""

[[goods.entries]]
id = 4602001
name = "Dito mozzato di Senzaluce"
info = "Da scambiare con Viso bianco Varré per oggetti utili nelle invasioni in multigiocatore."
description = """\
Il dito torto di un Senzaluce, mutilato e riconoscibile solo dalla sua flebile risonanza con altri mondi.
Usato come prova del proprio contributo all'imminente dinastia Mohgwyn: lo spargimento di sangue nobile.

I cavalieri Sanguepuro, o coloro che aspirano a esserne unti, li scambiano con equipaggiamento che potrebbe rivelarsi efficace nei futuri spargimenti di sangue.\
"""

[[goods.entries]]
id = 4602002
name = "Moneta giara"
info = "Da scambiare al negozio della giara della Rocca della Tavola rotonda per oggetti utili nel multigiocatore cooperativo."
description = """\
Seguendo la cultura delle giare, i Senzaluce donano queste monete ai compagni per mostrare gratitudine per la cooperazione in battaglia.
Alla Rocca della Tavola rotonda, una giara accetta queste monete in cambio di oggetti che i cooperatori potrebbero trovare utili, soprattutto per respingere gli invasori.\
"""


[[goods.entries]]
id = 4600000
name = "Treccia di Marika"
info = "Rianima dalla morte ripristinando completamente il personaggio."
description = """\
Oggetto per Duellare Online.
Incantato dalle preghiere dei Fondamentalisti della Legge Dorata.

Usato per rinvigorire un duellante sconfitto. Subito dopo la sua morte, viene ripristinato al suo stato prima della battaglia.

Cura completamente HP, FP, ripristina la Poise, rimuove tutti gli status alterati ed effetti speciali.\
"""

[[goods.entries]]
id = 4600100
name = "Unguento Regressivo"
info = "Ripristina completamente il personaggio"
description = """\
Oggetto per Duellare Online.
Incantato dalle preghiere dei Fondamentalisti della Legge Dorata.

Usato per ripristinare rapidamente i duellanti al loro stato prima della battaglia.

Cura completamente HP, FP, ripristina la Poise, rimuove tutti gli status alterati ed effetti speciali.\
"""

[[goods.entries]]
id = 4600200
name = "O'vas Turgido"
info = "Garantisce un ammontare infinito di qualsiasi oggetto in possesso"
description = """\
Oggetto per Duellare Online.
Incantato dalle preghiere dei Fondamentalisti della Legge Dorata.

Usato per immagazzinare e possedere quantità infinite di consumabili.
Ogni oggetto utilizzato manterrà la sua quantità attuale.

Un vaso senza fondo peculiare a dir poco. Le sue origini sono sconosciute. Alcuni lo deridono come simbolo di un' avarizia senza briglie.\
"""

[[goods.entries]]
id = 4600300
name = "Phantom Calling Bell"
info = "Calls phantoms who left their red sign"
description = """\
Item for online duelist play.
Enchanted by incantations of the Golden Order Fundamentalists.

A powerful bell used to summon those who seek a battle. Summons all available red signs.\
"""

[[goods.entries]]
id = 4602001
name = "Tarnished's Severed Finger"
info = "Exchange through White Mask Varré for items useful in invasion multiplayer."
description = """\
A tarnished's furled finger, mutilated and only recognizable by its trace resonance with other worlds.
Used as proof of one's contribution to oncoming Mohgwyn dynasty, the spilling of noble blood.

Pureblood knights, or those who strive to be anointed as one, exchange these for equipment that may be effective in future spilling.\
"""

[[goods.entries]]
id = 4602002
name = "Jar Coin"
info = "Exchange at the roundtable jar shop for items useful in cooperative multiplayer."
description = """\
Taking after the culture of jars, tarnished gift these coins to their companions to show appreciation for their cooperation in battle.
At the roundtable, a jar accepts these coins in exchange for items cooperators might find useful, especially for warding off invaders. \
"""

